name: Publish plugin release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: plugin-release
  cancel-in-progress: false
jobs:
  native-rdp:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config freerdp3-dev libwinpr3-dev
      - run: bash scripts/build-uremote-rdp.sh
      - uses: actions/upload-artifact@v6
        with:
          name: uremote-rdp-${{ matrix.rid }}
          path: src/URemote.Module/Native/bin/${{ matrix.rid }}/*
          if-no-files-found: error
  release:
    needs: native-rdp
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'
      - name: Read plugin version
        run: |
          python3 - <<'PYCODE'
          import json, os, re
          from pathlib import Path
          version = json.loads(Path('src/URemote.Module/app.json').read_text())['version']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit('Invalid plugin release version')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'PLUGIN_VERSION={version}\n')
          PYCODE
      - uses: actions/download-artifact@v7
        with:
          pattern: uremote-rdp-*
          path: artifacts/uremote-native
      - name: Stage native RDP components
        run: |
          for rid in linux-x64 linux-arm64; do
            mkdir -p "src/URemote.Module/Native/bin/$rid"
            cp "artifacts/uremote-native/uremote-rdp-$rid/"* "src/URemote.Module/Native/bin/$rid/"
          done
      - run: dotnet restore URemote.slnx
      - run: dotnet build URemote.slnx -c Release --no-restore -m:1
      - run: dotnet run --project tests/URemote.ProtocolChecks -c Release --no-build
      - run: dotnet run --project tests/URemote.Media.Tests -c Release --no-build -- --candidate-signaling-check
      - run: dotnet run --project tests/URemote.Media.Tests -c Release --no-build -- --clipboard-check
      - name: Package and validate plugin
        run: python3 scripts/package.py
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'NOTES'
          U远程是星栈的远程控制插件，需要安装星栈后导入 .appbundle 使用。
          星栈下载：https://github.com/hdward-dev/asterdock/releases

          本次更新修复手机输入法提交中文、英文和表情时无法输入的问题，补全信令定期续期，并支持通过 uinput 发送桌面组合键。
          本机 Niri Unicode 输入实测通过；KDE/GNOME Portal 文字输入尚待实机验证。
          附带 SHA256SUMS.txt 用于校验插件包。
          NOTES
          gh release create "v$PLUGIN_VERSION" artifacts/release/AsterDock-App-u-remote.appbundle artifacts/release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "U远程 v$PLUGIN_VERSION · 星栈远程控制插件" --notes-file /tmp/release-notes.md
